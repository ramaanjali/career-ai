<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - PDF AI Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='forgot_password.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🔐
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered email
        </p>

        {% if error %}

        <div class="message error">
            {{ error }}
        </div>

        {% endif %}

        <form
            action="{{ url_for('forgot_password') }}"
            method="POST">

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter registered email"
                    required>

            </div>

            <button
                type="submit"
                class="auth-button">

                Continue

            </button>

        </form>

        <p class="bottom-text">

            Remember your password?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

</body>

</html>
