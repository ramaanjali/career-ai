<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password - PDF AI Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='reset_password.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🔑
        </div>

        <h1>Reset Password</h1>

        <p class="subtitle">
            Create your new password
        </p>

        {% if error %}

        <div class="message error">
            {{ error }}
        </div>

        {% endif %}

        <form
            action="{{ url_for('reset_password') }}"
            method="POST">

            <input
                type="hidden"
                name="email"
                value="{{ email }}">

            <div class="input-group">

                <label for="password">
                    New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)">

                        👁

                    </button>

                </div>

            </div>

            <div class="input-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirm_password', this)">

                        👁

                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="auth-button">

                Reset Password

            </button>

        </form>

        <p class="bottom-text">

            Remember your password?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

<script
    src="{{ url_for('static', filename='auth.js') }}">
</script>

</body>

</html>
